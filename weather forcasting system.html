<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skyline — Weather</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Syne:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --card-bg: rgba(18, 10, 4, 0.75);
    --border: rgba(255,255,255,0.1);
    --text: #f5ede6;
    --muted: rgba(245,237,230,0.4);
    --accent: #f97316;
  }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #0d0600;
    font-family: 'Syne', sans-serif;
    color: var(--text);
  }

  #three-canvas {
    position: fixed; inset: 0;
    z-index: 0;
  }

  #cursor-glow {
    position: fixed;
    width: 300px; height: 300px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(249,115,22,0.1) 0%, transparent 70%);
    pointer-events: none;
    transform: translate(-50%, -50%);
    z-index: 1;
    transition: opacity 0.3s;
  }

  #app {
    position: fixed; inset: 0;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
  }

  .card {
    width: 420px;
    background: var(--card-bg);
    border: 0.5px solid var(--border);
    border-radius: 32px;
    padding: 2.5rem;
    backdrop-filter: blur(40px);
    -webkit-backdrop-filter: blur(40px);
    box-shadow:
      0 0 0 0.5px rgba(255,255,255,0.06) inset,
      0 40px 80px rgba(0,0,0,0.6),
      0 0 60px rgba(249,115,22,0.06);
    opacity: 0;
    transform: translateY(30px);
  }

  .card-header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 2rem;
  }

  .logo {
    font-family: 'Cormorant Garamond', serif;
    font-size: 32px;
    font-weight: 300;
    font-style: italic;
    letter-spacing: -0.02em;
    color: #fff;
    line-height: 1;
  }

  .eyebrow {
    font-size: 10px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .search {
    display: flex;
    gap: 10px;
    margin-bottom: 2.5rem;
  }

  .search input {
    flex: 1;
    background: rgba(255,255,255,0.05);
    border: 0.5px solid var(--border);
    border-radius: 14px;
    padding: 12px 16px;
    font-family: 'Syne', sans-serif;
    font-size: 14px;
    color: #fff;
    outline: none;
    transition: all 0.3s;
  }

  .search input::placeholder { color: var(--muted); }

  .search input:focus {
    border-color: rgba(249,115,22,0.5);
    background: rgba(249,115,22,0.05);
    box-shadow: 0 0 0 3px rgba(249,115,22,0.1);
  }

  .search-btn {
    width: 46px; height: 46px;
    border-radius: 14px;
    border: 0.5px solid var(--border);
    background: rgba(249,115,22,0.1);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
    color: var(--accent);
    flex-shrink: 0;
  }

  .search-btn:hover {
    background: rgba(249,115,22,0.18);
    border-color: rgba(249,115,22,0.35);
    transform: scale(1.05);
  }

  .search-btn:active { transform: scale(0.96); }
  .search-btn svg { width: 18px; height: 18px; fill: currentColor; }

  .weather-main {
    text-align: center;
    padding: 0.5rem 0 2rem;
    position: relative;
  }

  .icon-ring {
    width: 120px; height: 120px;
    margin: 0 auto 1.5rem;
    position: relative;
  }

  .icon-ring-svg {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    animation: spinRing 12s linear infinite;
  }

  @keyframes spinRing {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  .icon-ring-inner {
    position: absolute;
    inset: 12px;
    background: rgba(249,115,22,0.06);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    border: 0.5px solid rgba(249,115,22,0.2);
  }

  .weather-icon {
    width: 56px; height: 56px;
    filter: drop-shadow(0 0 16px rgba(249,115,22,0.55));
    transition: all 0.5s cubic-bezier(0.34,1.56,0.64,1);
  }

  .weather-icon.swap {
    transform: scale(0) rotate(-90deg);
    opacity: 0;
  }

  .temp-display {
    display: flex;
    align-items: flex-start;
    justify-content: center;
    gap: 4px;
    line-height: 1;
    margin-bottom: 0.5rem;
  }

  .temp-value {
    font-family: 'Cormorant Garamond', serif;
    font-size: 88px;
    font-weight: 300;
    color: #fff;
    line-height: 0.9;
    letter-spacing: -0.03em;
  }

  .temp-unit {
    font-family: 'Cormorant Garamond', serif;
    font-size: 36px;
    font-weight: 300;
    color: var(--muted);
    margin-top: 10px;
  }

  .city-name {
    font-size: 17px;
    font-weight: 400;
    color: rgba(255,255,255,0.85);
    margin-bottom: 4px;
    letter-spacing: 0.02em;
  }

  .condition-text {
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }

  .divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 1.5rem;
  }

  .divider-line {
    flex: 1;
    height: 0.5px;
    background: var(--border);
  }

  .divider-dot {
    width: 3px; height: 3px;
    border-radius: 50%;
    background: var(--muted);
  }

  .details {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  .detail-card {
    background: rgba(255,255,255,0.03);
    border: 0.5px solid var(--border);
    border-radius: 18px;
    padding: 1.1rem 1.2rem;
    transition: all 0.3s;
    cursor: default;
  }

  .detail-card:hover {
    background: rgba(249,115,22,0.07);
    border-color: rgba(249,115,22,0.25);
    transform: translateY(-2px);
  }

  .detail-label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    color: var(--muted);
    margin-bottom: 6px;
  }

  .detail-value {
    font-family: 'Cormorant Garamond', serif;
    font-size: 28px;
    font-weight: 300;
    color: #fff;
    line-height: 1;
  }

  .detail-sub {
    font-size: 11px;
    color: var(--muted);
    margin-top: 2px;
  }

  .error-toast {
    position: fixed;
    bottom: 2rem;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: rgba(220, 80, 80, 0.15);
    border: 0.5px solid rgba(220, 80, 80, 0.3);
    border-radius: 12px;
    padding: 10px 20px;
    font-size: 13px;
    color: #ff9999;
    backdrop-filter: blur(20px);
    z-index: 100;
    transition: transform 0.4s cubic-bezier(0.34,1.56,0.64,1), opacity 0.4s;
    opacity: 0;
    pointer-events: none;
  }

  .error-toast.show {
    transform: translateX(-50%) translateY(0);
    opacity: 1;
  }

  .loading-bar {
    position: fixed;
    top: 0; left: 0;
    height: 2px;
    width: 0%;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    z-index: 200;
    transition: width 0.3s ease, opacity 0.3s;
    opacity: 0;
    border-radius: 0 2px 2px 0;
  }

  .feels-badge {
    display: inline-block;
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--accent);
    background: rgba(249,115,22,0.1);
    border: 0.5px solid rgba(249,115,22,0.25);
    border-radius: 20px;
    padding: 3px 10px;
    margin-top: 10px;
  }
</style>
</head>
<body>

<canvas id="three-canvas"></canvas>
<div id="cursor-glow"></div>
<div class="loading-bar" id="loadingBar"></div>

<div id="app">
  <div class="card" id="card">
    <div class="card-header">
      <h1 class="logo">Skyline</h1>
      <span class="eyebrow">Live Forecast</span>
    </div>

    <div class="search">
      <input type="text" id="searchInput" placeholder="Search a city…" spellcheck="false" aria-label="City name">
      <button class="search-btn" id="searchBtn" aria-label="Search">
        <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
      </button>
    </div>

    <div class="weather-main" id="weatherMain">
      <div class="icon-ring">
        <svg class="icon-ring-svg" viewBox="0 0 120 120" fill="none">
          <circle cx="60" cy="60" r="56" stroke="url(#ringGrad)" stroke-width="0.5" stroke-dasharray="4 8" stroke-linecap="round"/>
          <defs>
            <linearGradient id="ringGrad" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#f97316" stop-opacity="0"/>
              <stop offset="40%" stop-color="#f97316" stop-opacity="0.7"/>
              <stop offset="100%" stop-color="#f97316" stop-opacity="0"/>
            </linearGradient>
          </defs>
        </svg>
        <div class="icon-ring-inner">
          <img id="weatherIcon" class="weather-icon" src="https://cdn-icons-png.flaticon.com/128/3075/3075858.png" alt="Weather">
        </div>
      </div>

      <div class="temp-display">
        <span class="temp-value" id="tempValue">--</span>
        <span class="temp-unit">°C</span>
      </div>

      <div class="city-name" id="cityName">Enter a city above</div>
      <div class="condition-text" id="conditionText">—</div>
      <div class="feels-badge" id="feelsBadge" style="display:none"></div>
    </div>

    <div class="divider">
      <div class="divider-line"></div>
      <div class="divider-dot"></div>
      <div class="divider-line"></div>
    </div>

    <div class="details">
      <div class="detail-card">
        <div class="detail-label">Humidity</div>
        <div class="detail-value" id="humidity">--</div>
        <div class="detail-sub">percent</div>
      </div>
      <div class="detail-card">
        <div class="detail-label">Wind Speed</div>
        <div class="detail-value" id="wind">--</div>
        <div class="detail-sub">km / hour</div>
      </div>
    </div>
  </div>
</div>

<div class="error-toast" id="errorToast">City not found. Try another name.</div>

<!-- Libraries -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

<script>
// ─── THREE.JS BACKGROUND ────────────────────────────────────────────────────
const canvas = document.getElementById('three-canvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.z = 5;

// Starfield
const starGeo = new THREE.BufferGeometry();
const starCount = 2000;
const positions = new Float32Array(starCount * 3);
const starSizes = new Float32Array(starCount);
for (let i = 0; i < starCount; i++) {
  positions[i * 3]     = (Math.random() - 0.5) * 40;
  positions[i * 3 + 1] = (Math.random() - 0.5) * 40;
  positions[i * 3 + 2] = (Math.random() - 0.5) * 20 - 5;
  starSizes[i] = Math.random() * 2.5 + 0.5;
}
starGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
starGeo.setAttribute('size', new THREE.BufferAttribute(starSizes, 1));

const starMat = new THREE.ShaderMaterial({
  uniforms: {
    uTime: { value: 0 },
    uColor: { value: new THREE.Color(0xf97316) }
  },
  vertexShader: `
    attribute float size;
    uniform float uTime;
    varying float vRand;
    float rand(float n){ return fract(sin(n) * 43758.5453); }
    void main() {
      vRand = rand(position.x * 100.0 + position.y);
      float twinkle = sin(uTime * 2.0 + vRand * 6.28) * 0.5 + 0.5;
      gl_PointSize = size * (0.5 + twinkle * 0.5);
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    uniform vec3 uColor;
    varying float vRand;
    void main() {
      float d = length(gl_PointCoord - 0.5) * 2.0;
      float alpha = smoothstep(1.0, 0.0, d);
      float brightness = 0.4 + vRand * 0.6;
      gl_FragColor = vec4(mix(vec3(1.0), uColor, 0.4) * brightness, alpha * brightness);
    }
  `,
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
});
const stars = new THREE.Points(starGeo, starMat);
scene.add(stars);

// Floating orbs (large soft glows)
const orbGroup = new THREE.Group();
scene.add(orbGroup);
const orbData = [
  { x: -3, y: 2, z: -3, r: 1.8, color: 0x5a1a00, speed: 0.4 },
  { x: 3, y: -1.5, z: -2, r: 1.4, color: 0x3a0e00, speed: 0.6 },
  { x: 0, y: -3, z: -4, r: 2.2, color: 0x4a1200, speed: 0.3 },
];
orbData.forEach(d => {
  const geo = new THREE.SphereGeometry(d.r, 32, 32);
  const mat = new THREE.MeshBasicMaterial({ color: d.color, transparent: true, opacity: 0.6 });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(d.x, d.y, d.z);
  mesh.userData = { oy: d.y, speed: d.speed, phase: Math.random() * Math.PI * 2 };
  orbGroup.add(mesh);
});

// Nebula plane
const nebulaGeo = new THREE.PlaneGeometry(20, 20);
const nebulaMat = new THREE.ShaderMaterial({
  uniforms: {
    uTime: { value: 0 },
    uWeatherColor: { value: new THREE.Color(0x6e2a00) }
  },
  vertexShader: `
    varying vec2 vUv;
    void main() {
      vUv = uv;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    uniform float uTime;
    uniform vec3 uWeatherColor;
    varying vec2 vUv;
    float noise(vec2 p) {
      return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
    }
    float smoothNoise(vec2 p) {
      vec2 i = floor(p);
      vec2 f = fract(p);
      f = f * f * (3.0 - 2.0 * f);
      float a = noise(i);
      float b = noise(i + vec2(1.0, 0.0));
      float c = noise(i + vec2(0.0, 1.0));
      float d = noise(i + vec2(1.0, 1.0));
      return mix(mix(a,b,f.x), mix(c,d,f.x), f.y);
    }
    void main() {
      vec2 uv = vUv * 3.0;
      float n1 = smoothNoise(uv + uTime * 0.05);
      float n2 = smoothNoise(uv * 2.0 - uTime * 0.03);
      float n = (n1 + n2) * 0.5;
      float d = length(vUv - 0.5) * 2.0;
      float alpha = smoothstep(1.0, 0.0, d) * n * 0.3;
      gl_FragColor = vec4(uWeatherColor, alpha);
    }
  `,
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  side: THREE.DoubleSide,
});
const nebula = new THREE.Mesh(nebulaGeo, nebulaMat);
nebula.position.z = -6;
scene.add(nebula);

// Mouse parallax
let mouseX = 0, mouseY = 0;
let targetX = 0, targetY = 0;
document.addEventListener('mousemove', e => {
  mouseX = (e.clientX / window.innerWidth - 0.5) * 2;
  mouseY = -(e.clientY / window.innerHeight - 0.5) * 2;

  const glow = document.getElementById('cursor-glow');
  glow.style.left = e.clientX + 'px';
  glow.style.top = e.clientY + 'px';
});

window.addEventListener('resize', () => {
  renderer.setSize(window.innerWidth, window.innerHeight);
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
});

let clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  starMat.uniforms.uTime.value = t;
  nebulaMat.uniforms.uTime.value = t;

  targetX += (mouseX * 0.3 - targetX) * 0.05;
  targetY += (mouseY * 0.3 - targetY) * 0.05;

  stars.rotation.y = targetX * 0.1;
  stars.rotation.x = targetY * 0.05;
  stars.rotation.z += 0.0002;

  orbGroup.children.forEach((orb, i) => {
    orb.position.y = orb.userData.oy + Math.sin(t * orb.userData.speed + orb.userData.phase) * 0.4;
    orb.position.x += Math.sin(t * 0.2 + i) * 0.001;
  });

  camera.position.x += (targetX * 0.5 - camera.position.x) * 0.04;
  camera.position.y += (targetY * 0.3 - camera.position.y) * 0.04;

  renderer.render(scene, camera);
}
animate();

// ─── GSAP INTRO ANIMATION ───────────────────────────────────────────────────
gsap.to('#card', {
  opacity: 1,
  y: 0,
  duration: 1.2,
  ease: 'power3.out',
  delay: 0.3
});

gsap.from('.card-header, .search, .weather-main, .divider, .details', {
  opacity: 0,
  y: 20,
  duration: 0.8,
  stagger: 0.1,
  ease: 'power2.out',
  delay: 0.6
});

// ─── WEATHER API ─────────────────────────────────────────────────────────────
const apikey = "5b9a76bf0d4ac07384f160fd860aea44";
const apiurl = "https://api.openweathermap.org/data/2.5/weather?units=metric&q=";

const iconMap = {
  Clouds: "https://cdn-icons-png.flaticon.com/128/1146/1146869.png",
  Clear: "https://cdn-icons-png.flaticon.com/128/6974/6974833.png",
  Rain: "https://cdn-icons-png.flaticon.com/128/8841/8841317.png",
  Drizzle: "https://cdn-icons-png.flaticon.com/128/3075/3075858.png",
  Mist: "https://cdn-icons-png.flaticon.com/128/3075/3075858.png",
  Fog: "https://cdn-icons-png.flaticon.com/128/3075/3075858.png",
  Snow: "https://cdn-icons-png.flaticon.com/128/6363/6363108.png",
  Thunderstorm: "https://cdn-icons-png.flaticon.com/128/1779/1779939.png",
};

const weatherColors = {
  Clear:       { nebula: 0x8a3500, orb: 0xf97316, star: 0xfba968 },
  Clouds:      { nebula: 0x4a2800, orb: 0xc8844a, star: 0xe0aa77 },
  Rain:        { nebula: 0x2a1800, orb: 0x885533, star: 0xbb8855 },
  Drizzle:     { nebula: 0x2a1800, orb: 0x885533, star: 0xbb8855 },
  Mist:        { nebula: 0x3a2218, orb: 0x886655, star: 0xbbaa99 },
  Fog:         { nebula: 0x3a2218, orb: 0x886655, star: 0xbbaa99 },
  Snow:        { nebula: 0x5a2a00, orb: 0xffbb88, star: 0xffd4aa },
  Thunderstorm:{ nebula: 0x3a1800, orb: 0xcc4400, star: 0xff8844 },
};

function setWeatherTheme(main) {
  const colors = weatherColors[main] || weatherColors.Clear;
  gsap.to(nebulaMat.uniforms.uWeatherColor.value, {
    r: ((colors.nebula >> 16) & 255) / 255,
    g: ((colors.nebula >> 8) & 255) / 255,
    b: (colors.nebula & 255) / 255,
    duration: 2,
    ease: 'power2.inOut'
  });
  gsap.to(starMat.uniforms.uColor.value, {
    r: ((colors.star >> 16) & 255) / 255,
    g: ((colors.star >> 8) & 255) / 255,
    b: (colors.star & 255) / 255,
    duration: 2,
    ease: 'power2.inOut'
  });
}

function animateCounter(el, target) {
  const start = parseFloat(el.textContent) || 0;
  gsap.fromTo({ val: start }, { val: target }, {
    duration: 1.2,
    ease: 'power2.out',
    onUpdate: function() { el.textContent = Math.round(this.targets()[0].val); }
  });
}

function showLoading(on) {
  const bar = document.getElementById('loadingBar');
  if (on) {
    gsap.set(bar, { width: '0%', opacity: 1 });
    gsap.to(bar, { width: '70%', duration: 0.8, ease: 'power1.out' });
  } else {
    gsap.to(bar, { width: '100%', duration: 0.3, ease: 'power1.in', onComplete: () => {
      gsap.to(bar, { opacity: 0, duration: 0.3, delay: 0.1 });
    }});
  }
}

function showError(msg) {
  const toast = document.getElementById('errorToast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 3000);
}

async function checkWeather(city) {
  if (!city.trim()) return;
  showLoading(true);

  try {
    const res = await fetch(apiurl + encodeURIComponent(city) + `&appid=${apikey}`);
    const data = await res.json();
    showLoading(false);

    if (data.cod !== 200) { showError('City not found. Try another name.'); return; }

    const main = data.weather[0].main;
    const icon = document.getElementById('weatherIcon');

    // Icon swap animation
    gsap.to(icon, {
      scale: 0, rotation: -90, opacity: 0, duration: 0.3,
      onComplete: () => {
        icon.src = iconMap[main] || iconMap.Drizzle;
        gsap.to(icon, { scale: 1, rotation: 0, opacity: 1, duration: 0.5, ease: 'back.out(1.7)' });
      }
    });

    // Animate temperature counter
    animateCounter(document.getElementById('tempValue'), Math.round(data.main.temp));
    animateCounter(document.getElementById('humidity'), data.main.humidity);
    animateCounter(document.getElementById('wind'), Math.round(data.wind.speed));

    // City + condition reveal
    const cityEl = document.getElementById('cityName');
    const condEl = document.getElementById('conditionText');
    const badge = document.getElementById('feelsBadge');

    gsap.to([cityEl, condEl], { opacity: 0, y: -8, duration: 0.2, onComplete: () => {
      cityEl.textContent = `${data.name}, ${data.sys.country}`;
      condEl.textContent = data.weather[0].description;
      badge.style.display = 'inline-block';
      badge.textContent = `Feels like ${Math.round(data.main.feels_like)}°C`;
      gsap.to([cityEl, condEl, badge], { opacity: 1, y: 0, duration: 0.4, stagger: 0.08, ease: 'power2.out' });
    }});

    // Detail cards bounce
    gsap.from('.detail-card', {
      scale: 0.95, opacity: 0.5, duration: 0.5, stagger: 0.1, ease: 'back.out(1.5)'
    });

    // Theme the 3D scene
    setWeatherTheme(main);

    // Card glow pulse
    gsap.fromTo('#card', { boxShadow: '0 0 0 1px rgba(249,115,22,0.35), 0 40px 80px rgba(0,0,0,0.6)' },
      { boxShadow: '0 0 0 0.5px rgba(255,255,255,0.06) inset, 0 40px 80px rgba(0,0,0,0.6), 0 0 60px rgba(249,115,22,0.06)', duration: 1.5, ease: 'power2.out' });

  } catch (e) {
    showLoading(false);
    showError('Connection error. Please try again.');
  }
}

document.getElementById('searchBtn').addEventListener('click', () => {
  checkWeather(document.getElementById('searchInput').value);
});

document.getElementById('searchInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') checkWeather(e.target.value);
});

// Button click ripple via GSAP
document.getElementById('searchBtn').addEventListener('mousedown', function() {
  gsap.to(this, { scale: 0.92, duration: 0.1, yoyo: true, repeat: 1 });
});
</script>
</body>
</html>
